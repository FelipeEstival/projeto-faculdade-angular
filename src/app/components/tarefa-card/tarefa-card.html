<article
  class="tarefa-card"
  [class.card--yellow]="tarefa.prioridade === 'alta' && tarefa.status !== 'concluida'"
  [class.card--blue]="
    tarefa.prioridade === 'media' && tarefa.status !== 'em-revisao' && tarefa.status !== 'concluida'
  "
  [class.card--purple]="tarefa.status === 'em-revisao' && tarefa.prioridade !== 'alta'"
>
  <div class="tarefa-card__top">
    <span class="deadline"
      ><app-icon name="calendar" />{{ tarefa.prazo | date: 'dd MMM' : '' : 'pt-BR' }}</span
    ><span class="task-id">#{{ tarefa.id }}</span>
  </div>
  <h2 class="tarefa-card__titulo">
    <a [routerLink]="['/tarefas', tarefa.id]">{{ tarefa.titulo }}</a>
  </h2>
  @if (tarefa.descricao) {
    <p class="tarefa-card__descricao">{{ tarefa.descricao }}</p>
  }
  <span class="status">{{ statusLabels[tarefa.status] }}</span>
  <footer>
    <span class="priority"
      ><span aria-hidden="true">●</span> {{ prioridadeLabels[tarefa.prioridade] }} prioridade</span
    ><span
      class="avatar"
      [title]="tarefa.responsavel || 'Sem responsável'"
      [attr.aria-label]="'Responsável: ' + (tarefa.responsavel || 'não atribuído')"
      >{{ iniciais(tarefa.responsavel) }}</span
    >
  </footer>
</article>
